<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Evolutionary Arena</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="hud">
    <div class="hud-row">
      <span class="hud-item">tick <span id="tick">000000</span></span>
      <span class="hud-item">plants <span id="plants">0</span></span>
      <span class="hud-item">creatures <span id="creatures">0</span>
        (<span id="veg" class="veg">0</span><span class="hud-sep">/</span><span id="carn" class="carn">0</span>)</span>
      <span class="hud-item">avg E <span id="avgEnergy">0</span></span>
      <span class="hud-item">lineage <span id="lineage">—</span></span>
      <span class="hud-item">best fit <span id="bestFit">—</span></span>
      <span class="hud-item">peak pop <span id="peakPop">0</span></span>
      <span class="hud-item">pop (200t)
        <canvas id="popChart" width="240" height="48"></canvas>
      </span>
      <div id="bestCard" hidden></div>
    </div>
    <div class="hud-row">
      <label class="hud-item">speed
        <input id="speed" type="range" min="1" max="64" step="1" value="1" />
        <span id="speedVal">1</span>x
      </label>
      <label class="hud-item">plant rate
        <input id="plantRate" type="range" min="0" max="0.5" step="0.01" value="0.3" />
        <span id="plantRateVal">0.30</span>
      </label>
      <label class="hud-item">mutation
        <input id="mutation" type="range" min="0" max="0.6" step="0.05" value="0.1" />
        <span id="mutationVal">0.10</span>
      </label>
      <button id="pauseBtn" class="btn">Resume</button>
      <button id="stepBtn" class="btn">Step</button>
      <button id="brushBtn" class="btn">Brush: Plant</button>
      <button id="killBtn" class="btn">Kill under cursor</button>
      <button id="herbBtn" class="btn">+Herbivore</button>
      <button id="carnBtn" class="btn">+Carnivore</button>
      <button id="resetBtn" class="btn">Reset world</button>
      <button id="recordsBtn" class="btn">Reset records</button>
    </div>
  </header>
  <main>
    <canvas id="world" width="1024" height="640"></canvas>
    <div id="splash"><div>
      <h1>Evolutionary Arena</h1>
      <p>paused — press space or hit Resume</p>
    </div></div>
  </main>
  <div id="inspect" hidden></div>
  <script type="module" src="src/engine.js"></script>
</body>
</html>
