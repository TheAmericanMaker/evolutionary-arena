<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Evolutionary Arena</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="hud">
    <div class="hud-row">
      <span class="hud-item">tick <span id="tick">000000</span></span>
      <span class="hud-item">plants <span id="plants">0</span></span>
      <span class="hud-item">creatures <span id="creatures">0</span>
        (<span id="veg" class="veg">0</span><span class="hud-sep">/</span><span id="carn" class="carn">0</span>)</span>
      <span class="hud-item">avg E <span id="avgEnergy">0</span></span>
      <span class="hud-item">lineage <span id="lineage">—</span></span>
      <span class="hud-item">best fit <span id="bestFit">—</span></span>
      <span class="hud-item">peak pop <span id="peakPop">0</span></span>
      <span class="hud-item">pop (200t)
        <canvas id="popChart" width="240" height="48"></canvas>
      </span>
      <div id="bestCard" hidden></div>
    </div>
    <div class="hud-row">
      <label class="hud-item">speed
        <input id="speed" type="range" min="1" max="64" step="1" value="1" />
        <span id="speedVal">1</span>x
      </label>
      <label class="hud-item">plant rate
        <input id="plantRate" type="range" min="0" max="0.5" step="0.01" value="0.3" />
        <span id="plantRateVal">0.30</span>
      </label>
      <label class="hud-item">mutation
        <input id="mutation" type="range" min="0" max="0.6" step="0.05" value="0.1" />
        <span id="mutationVal">0.10</span>
      </label>
      <button id="pauseBtn" class="btn">Resume</button>
      <button id="stepBtn" class="btn">Step</button>
      <button id="brushBtn" class="btn">Brush: Plant</button>
      <button id="killBtn" class="btn">Kill under cursor</button>
      <button id="terrainBtn" class="btn" title="Paint biomes: drag on the canvas">Terrain</button>
      <span id="biomeSwatches">
        <button class="swatch active" data-biome="1" style="background:#0c2038" title="Water — impassable, no plants"></button>
        <button class="swatch" data-biome="2" style="background:#262b36" title="Rock — impassable, no plants"></button>
        <button class="swatch" data-biome="3" style="background:#0f2018" title="Forest — plants grow 2x"></button>
        <button class="swatch" data-biome="4" style="background:#182230" title="Tundra — plants 0.5x, metabolism +25%"></button>
        <button class="swatch" data-biome="0" style="background:#0b0e14" title="Open — clear terrain"></button>
      </span>
      <button id="herbBtn" class="btn" title="Shift-click spawns 5">+Herbivore</button>
      <button id="carnBtn" class="btn" title="Shift-click spawns 5">+Carnivore</button>
      <button id="resetBtn" class="btn">Reset world</button>
      <button id="recordsBtn" class="btn">Reset records</button>
    </div>
  </header>
  <main>
    <canvas id="world" width="1024" height="640"></canvas>
    <div id="splash"><div>
      <h1>Evolutionary Arena</h1>
      <p>paused — press space or hit Resume</p>
      <p class="hint">canvas click: inspect a creature / plant · shift-click: ×5 · +buttons: shift-click = ×5 · Terrain: pick a swatch, then drag</p>
    </div></div>
  </main>
  <div id="inspect" hidden></div>
  <script type="module" src="src/engine.js"></script>
  <script>
    // Boot watchdog (classic script, so it runs even when the module graph
    // does not): if engine.js has not flagged a successful boot shortly
    // after load — e.g. the page was opened directly via file://, where
    // browsers block ES module scripts — replace the dead splash with
    // instructions instead of leaving an unresponsive screen.
    setTimeout(function () {
      if (window.__arenaBooted) return;
      var s = document.querySelector('#splash div');
      if (!s) return;
      s.innerHTML =
        '<h1>Evolutionary Arena</h1>' +
        '<p>Could not start: this page uses ES modules, which browsers ' +
        'block when the file is opened directly (file://).</p>' +
        '<p>Serve the folder instead, then open the local URL:</p>' +
        '<pre>python3 -m http.server 8000</pre>' +
        '<p>then visit <a href="http://localhost:8000/">http://localhost:8000/</a></p>';
    }, 1000);
  </script>
</body>
</html>
